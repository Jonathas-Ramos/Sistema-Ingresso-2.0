<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Validar QR Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-sm">
                <div class="card-header fw-bold">Validacao de Ingresso por QR Code/Hash</div>
                <div class="card-body">
                    <form action="/admin/validar" method="post">
                        <label class="form-label">Codigo hash lido no QR Code</label>
                        <textarea class="form-control mb-3" name="codigoHash" rows="3" required></textarea>
                        <button class="btn btn-success" type="submit">Validar Entrada</button>
                        <a href="/admin" class="btn btn-secondary">Voltar</a>
                    </form>

                    <div th:if="${mensagem}" class="alert alert-success mt-3" th:text="${mensagem}"></div>
                    <div th:if="${erro}" class="alert alert-danger mt-3" th:text="${erro}"></div>

                    <div th:if="${ingresso}" class="mt-3">
                        <p class="mb-1"><strong>Evento:</strong> <span th:text="${ingresso.evento}"></span></p>
                        <p class="mb-1"><strong>Status:</strong> <span th:text="${ingresso.estado}"></span></p>
                        <p class="small text-muted text-break" th:text="${ingresso.codigoHash}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
