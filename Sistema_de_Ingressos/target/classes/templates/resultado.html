<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Confirmação de Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="alert alert-success shadow-sm" role="alert">
                <h4 class="alert-heading mb-3">🎉 Compra Realizada com Sucesso!</h4>
                <hr>
                <p class="mb-2"><strong>Impressão:</strong> <span th:text="${detalhes}"></span></p>
                <p class="mb-2"><strong>Valor Pago:</strong> <span class="badge bg-success fs-6" th:text="'R$ ' + ${valorFinal}"></span></p>
                <p class="mb-0"><strong>Status:</strong> <span class="badge bg-info text-dark" th:text="${estado}"></span></p>
                <p class="mt-3 mb-1"><strong>Hash:</strong></p>
                <p class="small text-break" th:text="${codigoHash}"></p>
                <img th:if="${qrCodeBase64}" th:src="'data:image/png;base64,' + ${qrCodeBase64}" class="img-fluid border rounded p-2 bg-white" alt="QR Code do ingresso">
            </div>

            <div class="text-center mt-4">
                <a href="/cliente/ingressos" class="btn btn-secondary me-2">Ver Meus Ingressos</a>
                <a href="/cliente/catalogo" class="btn btn-outline-primary">Voltar para o Catalogo</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
