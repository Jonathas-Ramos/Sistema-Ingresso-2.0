<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro no Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card p-4 shadow-lg" style="width: 380px;">
    <h3 class="text-center mb-4">Criar Nova Conta</h3>

    <!-- Caixa de Erro (Ex: E-mail já existe) -->
    <div th:if="${erro}" class="alert alert-danger p-2 text-center" th:text="${erro}"></div>

    <form action="/realizarCadastro" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold">Seu melhor E-mail</label>
            <input type="email" name="email" class="form-control" required placeholder="exemplo@email.com">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Crie uma Senha</label>
            <input type="password" name="senha" class="form-control" required placeholder="Mínimo 6 caracteres">
        </div>
        <button type="submit" class="btn btn-success w-100 mb-3">Finalizar Cadastro</button>
    </form>

    <div class="text-center mt-2">
        <a href="/login" class="text-decoration-none text-secondary">< Voltar para o Login</a>
    </div>
</div>

</body>
</html>
