<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login do Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card p-4 shadow-lg" style="width: 380px;">
    <h3 class="text-center mb-4">Acesso ao Sistema</h3>

    <!-- Caixa de Erro -->
    <div th:if="${erro}" class="alert alert-danger p-2 text-center" th:text="${erro}"></div>

    <!-- Caixa de Sucesso (após cadastrar) -->
    <div th:if="${mensagemSucesso}" class="alert alert-success p-2 text-center" th:text="${mensagemSucesso}"></div>

    <form action="/realizarLogin" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold">E-mail</label>
            <input type="email" name="email" class="form-control" required placeholder="Digite seu e-mail">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Senha</label>
            <input type="password" name="senha" class="form-control" required placeholder="Digite sua senha">
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>
    </form>

    <div class="text-center mt-2">
        <span class="text-muted">Ainda não tem conta?</span>
        <a href="/cadastro" class="text-decoration-none fw-bold">Cadastre-se aqui</a>
    </div>
</div>

</body>
</html>
