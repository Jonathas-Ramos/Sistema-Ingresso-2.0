<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Catalogo de Eventos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/cliente/catalogo">Sistema de Ingressos</a>
        <div class="d-flex gap-2">
            <a href="/cliente/ingressos" class="btn btn-outline-light btn-sm">Meus Ingressos</a>
            <a href="/comprar" class="btn btn-outline-light btn-sm">Cadastrar Ingresso</a>
            <a href="/logout" class="btn btn-danger btn-sm">Sair</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0">Catalogo de Eventos</h2>
            <p class="text-muted mb-0">Bem-vindo, <span th:text="${cliente.nome}"></span></p>
        </div>
    </div>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="evento : ${eventos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title" th:text="${evento.nome}"></h5>
                    <p class="card-text text-muted" th:text="${evento.descricao}"></p>
                    <p class="mb-1"><strong>Data:</strong> <span th:text="${#temporals.format(evento.dataHora, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p class="mb-1"><strong>Local:</strong> <span th:text="${evento.local}"></span></p>
                    <p class="mb-1"><strong>Disponiveis:</strong> <span th:text="${evento.quantidadeDisponivel}"></span></p>
                    <p class="mb-3"><strong>Valor:</strong> R$ <span th:text="${#numbers.formatDecimal(evento.valorIngresso, 1, 'POINT', 2, 'COMMA')}"></span></p>

                    <form th:action="@{/cliente/reservar/{id}(id=${evento.id})}" method="post" class="mt-auto">
                        <button class="btn btn-success w-100" type="submit" th:disabled="${evento.quantidadeDisponivel <= 0}">
                            Reservar Ingresso
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
