<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meus Ingressos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/cliente/catalogo">Sistema de Ingressos</a>
        <div class="d-flex gap-2">
            <a href="/cliente/catalogo" class="btn btn-outline-light btn-sm">Catalogo</a>
            <a href="/comprar" class="btn btn-outline-light btn-sm">Cadastrar Ingresso</a>
            <a href="/logout" class="btn btn-danger btn-sm">Sair</a>
        </div>
    </div>
</nav>

<main class="container py-4">
    <h2>Meus Ingressos</h2>
    <p class="text-muted">Acompanhe suas reservas e apresente o QR Code na entrada do evento.</p>

    <div class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="ingresso : ${ingressos}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${ingresso.evento}"></h5>
                    <p class="mb-1"><strong>Data:</strong> <span th:text="${#temporals.format(ingresso.dataEvento, 'dd/MM/yyyy HH:mm')}"></span></p>
                    <p class="mb-1"><strong>Status:</strong> <span class="badge bg-primary" th:text="${ingresso.estado}"></span></p>
                    <p class="mb-1"><strong>Hash:</strong></p>
                    <p class="small text-break text-muted" th:text="${ingresso.codigoHash}"></p>
                    <img th:if="${ingresso.qrCodeBase64}" th:src="'data:image/png;base64,' + ${ingresso.qrCodeBase64}" class="img-fluid border rounded p-2" alt="QR Code do ingresso">
                    <div class="btn-group w-100 mt-3" th:if="${ingresso.estado.name() == 'PAGO' || ingresso.estado.name() == 'RESERVADO'}">
                        <a th:href="@{/cliente/cancelar/{id}(id=${ingresso.id})}" class="btn btn-outline-danger btn-sm">Cancelar</a>
                        <a th:href="@{/cliente/devolver/{id}(id=${ingresso.id})}" class="btn btn-outline-primary btn-sm">Devolver</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(ingressos)}">
            <div class="alert alert-info">Voce ainda nao possui ingressos reservados.</div>
        </div>
    </div>
</main>
</body>
</html>
