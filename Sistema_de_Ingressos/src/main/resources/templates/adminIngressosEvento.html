<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ingressos por Evento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 th:text="'Ingressos - ' + ${evento.nome}"></h2>
        <a href="/admin" class="btn btn-secondary">Voltar</a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-striped mb-0 align-middle">
                <thead>
                <tr>
                    <th>Hash</th>
                    <th>Status</th>
                    <th>Valor</th>
                    <th>Expira em</th>
                    <th>Acoes</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="ingresso : ${ingressos}">
                    <td class="small text-break" th:text="${ingresso.codigoHash}"></td>
                    <td><span class="badge bg-primary" th:text="${ingresso.estado}"></span></td>
                    <td>R$ <span th:text="${#numbers.formatDecimal(ingresso.calcularValor(), 1, 'POINT', 2, 'COMMA')}"></span></td>
                    <td th:text="${#temporals.format(ingresso.dataExpiracao, 'dd/MM/yyyy HH:mm')}"></td>
                    <td>
                        <form th:if="${ingresso.estado.name() == 'RESERVADO'}" th:action="@{/admin/confirmar/{id}(id=${ingresso.id})}" method="post">
                            <input type="hidden" name="eventoId" th:value="${evento.id}">
                            <button type="submit" class="btn btn-sm btn-success">Confirmar</button>
                        </form>
                        <span th:unless="${ingresso.estado.name() == 'RESERVADO'}" class="text-muted small">Sem acoes</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(ingressos)}">
                    <td colspan="5" class="text-center text-muted py-3">Nenhum ingresso emitido para este evento.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
