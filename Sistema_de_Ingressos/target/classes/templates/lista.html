<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Consulta de Ingressos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Ingressos Vendidos</h2>
        <a href="/comprar" class="btn btn-primary"><i class="bi bi-plus-circle"></i> Nova Compra</a>
    </div>

    <div class="card shadow">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0 align-middle text-center">
                    <thead class="table-dark">
                    <tr>
                        <th>ID (Hash)</th>
                        <th>Evento</th>
                        <th>Data</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Loop do Thymeleaf -->
                    <tr th:each="ing : ${ingressos}">
                        <td class="text-muted small" th:text="${ing.codigoHash != null ? #strings.substring(ing.codigoHash, 0, 8) + '...' : #strings.substring(ing.id, 0, 8) + '...'}"></td>
                        <td class="fw-bold" th:text="${ing.evento}"></td>
                        <td th:text="${#temporals.format(ing.dataEvento, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${ing.getClass().getSimpleName().replace('Ingresso', '')}"></td>
                        <td class="text-success fw-bold" th:text="'R$ ' + ${#numbers.formatDecimal(ing.calcularValor(), 1, 'POINT', 2, 'COMMA')}"></td>

                        <!-- Badges coloridos dependendo do status -->
                        <td>
                            <span th:if="${ing.estado.name() == 'PAGO'}" class="badge bg-success">Pago</span>
                            <span th:if="${ing.estado.name() == 'RESERVADO'}" class="badge bg-primary">Reservado</span>
                            <span th:if="${ing.estado.name() == 'UTILIZADO'}" class="badge bg-secondary">Utilizado</span>
                            <span th:if="${ing.estado.name() == 'CANCELADO'}" class="badge bg-danger">Cancelado</span>
                            <span th:if="${ing.estado.name() == 'DEVOLVIDO'}" class="badge bg-warning text-dark">Devolvido</span>
                        </td>

                        <!-- Botões de Ação -->
                        <td>
                            <div th:if="${ing.estado.name() == 'PAGO' || ing.estado.name() == 'RESERVADO'}" class="btn-group btn-group-sm">
                                <a th:href="@{/cancelar/{id}(id=${ing.id})}" class="btn btn-outline-danger" title="Cancelar Compra">
                                    <i class="bi bi-x-circle"></i> Cancelar
                                </a>
                                <a th:href="@{/devolver/{id}(id=${ing.id})}" class="btn btn-outline-primary" title="Solicitar Reembolso">
                                    <i class="bi bi-arrow-counterclockwise"></i> Devolver
                                </a>
                            </div>
                            <span th:unless="${ing.estado.name() == 'PAGO'}" class="text-muted small">Sem ações</span>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ingressos)}">
                        <td colspan="7" class="text-center py-4 text-muted">Nenhum ingresso encontrado no banco de dados.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
