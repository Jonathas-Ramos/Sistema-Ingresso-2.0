<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Comprar Ingresso</title>
    <!-- Adicionando o Bootstrap via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h3 class="mb-0">Sistema de Ingressos</h3>
                </div>
                <div class="card-body">
                    <form action="/comprarIngresso" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome do Evento:</label>
                            <input type="text" class="form-control" name="evento" placeholder="Ex: Show de Rock" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Data e Hora do Evento:</label>
                            <input type="datetime-local" class="form-control" name="dataEvento" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Valor Base (R$):</label>
                            <input type="number" step="0.01" class="form-control" name="valorBase" placeholder="Ex: 100.00" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Ingresso:</label>
                            <select class="form-select" name="tipo" id="tipo" onchange="mostrarTaxaVip()">
                                <option value="NORMAL">Normal</option>
                                <option value="MEIA">Meia-Entrada</option>
                                <option value="VIP">VIP</option>
                            </select>
                        </div>

                        <div class="mb-3" id="divTaxaVip" style="display:none;">
                            <label class="form-label fw-bold">Taxa VIP (R$):</label>
                            <input type="number" step="0.01" class="form-control" name="taxaVip" value="0.0">
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-success btn-lg">Finalizar Compra</button>
                            <a href="/cliente/ingressos" class="btn btn-outline-secondary">Ver Meus Ingressos</a>
                            <a href="/cliente/catalogo" class="btn btn-outline-primary">Voltar para o Catalogo</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function mostrarTaxaVip() {
        var tipo = document.getElementById("tipo").value;
        var divTaxaVip = document.getElementById("divTaxaVip");
        if (tipo === "VIP") {
            divTaxaVip.style.display = "block";
        } else {
            divTaxaVip.style.display = "none";
        }
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
