<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro de Administrador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center" style="height: 100vh;">

<div class="card p-4 shadow-lg" style="width: 380px;">
    <h3 class="text-center mb-4">Criar Admin</h3>

    <div th:if="${erro}" class="alert alert-danger p-2 text-center" th:text="${erro}"></div>

    <form action="/realizarCadastroAdmin" method="post">
        <div class="mb-3">
            <label class="form-label fw-bold">E-mail do admin</label>
            <input type="email" name="email" class="form-control" required placeholder="admin@email.com">
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Senha</label>
            <input type="password" name="senha" class="form-control" required placeholder="Digite uma senha">
        </div>
        <button type="submit" class="btn btn-warning w-100 mb-3">Cadastrar Administrador</button>
    </form>

    <div class="text-center mt-2">
        <a href="/login" class="text-decoration-none text-secondary">< Voltar para o Login</a>
    </div>
</div>

</body>
</html>
